name: Verify committed Graphify graph is up to date

on:
  pull_request:
    paths:
      - "src/main/java/**"
      - "graphify-out/graph.json"
      - "graphify-out/graph.html"
      - "graphify-out/GRAPH_REPORT.md"
      - ".github/workflows/verify-committed-graphify-graph-is-up-to-date.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-graphify-graph-is-up-to-date:
    name: Verify committed Graphify graph is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install graphifyy==0.9.56

      - name: Regenerate committed Graphify graph
        run: |
          graphify extract src/main/java --code-only --out .
          graphify cluster-only . --no-label

      - name: Fail if committed Graphify graph is stale
        run: |
          git diff --exit-code -- \
            graphify-out/graph.json \
            graphify-out/graph.html \
            graphify-out/GRAPH_REPORT.md
